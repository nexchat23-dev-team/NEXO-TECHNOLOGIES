    <link rel="stylesheet" href="cmd-palette.css">
    <style>
        :root{--nexo-black:#020812;--neon-cyan:#00f5ff;--neon-green:#00ff88;--neon-magenta:#ff006e;--neon-gold:#ffd700;--text-primary:#e8f4fd;--text-muted:#4a6680;--glow-green:0 0 20px rgba(0,255,136,.6);}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%;height:calc(var(--vh, 1vh) * 100);overflow:hidden;-webkit-text-size-adjust:100%}
        body{background:var(--nexo-black);color:var(--neon-green);font-family:'JetBrains Mono',monospace}
        
        @media (hover: hover) and (pointer: fine) {
            body { cursor: none; }
            #custom-cursor{position:fixed;width:2px;height:20px;background:var(--neon-green);pointer-events:none;z-index:99999;transform:translate(-50%,-50%);box-shadow:var(--glow-green);animation:cBlink .8s step-end infinite}
            @keyframes cBlink{0%,100%{opacity:1}50%{opacity:0}}
        }
        @media (hover: none), (pointer: coarse) {
            #custom-cursor { display: none !important; }
        }

        #matrix-rain{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;opacity:.08;pointer-events:none}
        .top-bar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(2,8,18,.97);border-bottom:1px solid rgba(0,255,136,.1);display:flex;align-items:center;justify-content:space-between;padding:.5rem 1.5rem;height:42px}
        .top-bar-left{display:flex;align-items:center;gap:.6rem}
        .tb-dot{width:12px;height:12px;border-radius:50%}
        .tb-dot-r{background:#ff5f57}.tb-dot-y{background:#febc2e}.tb-dot-g{background:#28c840}
        .tb-title{font-size:.72rem;color:var(--text-muted);letter-spacing:.12em;margin-left:.4rem}
        .tb-title span{color:var(--neon-green)}
        .top-bar-right{display:flex;align-items:center;gap:1.5rem}
        .tb-nav{display:flex;gap:.8rem}
        .tb-nav a{font-size:.65rem;color:var(--text-muted);text-decoration:none;letter-spacing:.1em;transition:.2s}
        .tb-nav a:hover{color:var(--neon-green)}
        .tb-status{font-size:.62rem;color:var(--neon-green);letter-spacing:.1em;display:flex;align-items:center;gap:.4rem}
        .tb-status-dot{width:5px;height:5px;border-radius:50%;background:var(--neon-green);animation:pls 1.5s infinite}
        @keyframes pls{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
        .terminal-wrapper{position:relative;z-index:10;height:100vh;height:calc(var(--vh, 1vh) * 100);padding-top:42px;display:flex;flex-direction:column}
        .terminal-body{flex:1;overflow-y:auto;padding:1.5rem 2rem;scrollbar-width:thin;scrollbar-color:rgba(0,255,136,.2) transparent}
        .terminal-body::-webkit-scrollbar{width:3px}
        .terminal-body::-webkit-scrollbar-thumb{background:rgba(0,255,136,.2);border-radius:2px}
        .boot-line{font-size:.78rem;line-height:1.9;opacity:0;transform:translateX(-8px);transition:opacity .3s ease,transform .3s ease;white-space:pre-wrap}
        .boot-line.visible{opacity:1;transform:none}
        .boot-line.dim{color:var(--text-muted)}
        .boot-line.success{color:var(--neon-green)}
        .boot-line.warn{color:var(--neon-gold)}
        .boot-line.err{color:#ff1744}
        .boot-line.cmd{color:var(--neon-cyan)}
        .boot-line.out{color:var(--text-primary);font-size:.8rem}
        .boot-line.art{color:var(--neon-cyan);font-size:.55rem;line-height:1.2;letter-spacing:0}
        .input-line{display:flex;align-items:center;gap:.5rem;padding:.8rem 2rem;background:rgba(2,8,18,.7);border-top:1px solid rgba(0,255,136,.06);flex-shrink:0}
        .prompt-text{color:var(--neon-cyan);font-size:.82rem;white-space:nowrap;user-select:none}
        .prompt-arr{color:var(--neon-green)}
        .term-input{background:transparent;border:none;outline:none;color:var(--neon-green);font-family:'JetBrains Mono',monospace;font-size:.82rem;flex:1;caret-color:transparent}
        .help-grid{display:grid;grid-template-columns:110px 1fr;gap:.3rem 1.5rem;font-size:.75rem;line-height:1.7}
        .hc{color:var(--neon-cyan)}.hd{color:var(--text-muted)}
        @media(max-width:600px){.terminal-body{padding:.8rem 1rem}.input-line{padding:.7rem 1rem}.boot-line.art{font-size:.38rem}.tb-nav{display:none}}
    </style>
</head>

        ctx.font='13px JetBrains Mono';
        drops.forEach((y,i)=>{
            const c=chars[Math.floor(Math.random()*chars.length)];
            ctx.fillText(c,i*16,y*16);
            if(y*16>canvas.height&&Math.random()>.975)drops[i]=0;
            drops[i]++;
        });
    }

    function resolveNode(pathStr) {
        let clean = pathStr.trim();
        if (clean === '~' || clean.startsWith('~/')) {
            clean = clean.replace('~', '/home/nexo');
        }
        let parts;
        if (clean.startsWith('/')) {
            parts = clean.split('/').filter(Boolean);
        } else {
            const currentParts = currentPath.split('/').filter(Boolean);
            parts = [...currentParts, ...clean.split('/').filter(Boolean)];
        }

        const resolved = [];
        for (const p of parts) {
            if (p === '.') continue;
            if (p === '..') {
                if (resolved.length > 0) resolved.pop();
            } else {
                resolved.push(p);
            }
        }

        let curr = VFS['/'];
        for (const part of resolved) {
            if (!curr.children || !curr.children[part]) return null;
            curr = curr.children[part];
        }
        return { node: curr, absPath: '/' + resolved.join('/') };
    }

    function executeLs(args) {

        }
        const entries = Object.keys(res.node.children || {}).sort();
        if (entries.length === 0) return '';
        const lines = entries.map(name => {
            const item = res.node.children[name];
            if (item.type === 'dir') {
                return `<span style="color:var(--neon-cyan);font-weight:700">drwxr-xr-x</span>  <span style="color:#00f5ff">${name}/</span>`;

            }
        });

        // Hex

        cmdHistory.unshift(trimmed); histIdx = -1;

        const parts = trimmed.split(/\s+/);
        const cmd = parts[0].toLowerCase();
        const args = parts.slice(1);

        appendLine(`<span style="color:var(--neon-cyan)">nexo@technologies:~$</span> ${raw}`, 'cmd');

        if(COMMANDS[cmd]){
            if (window.NexoAudio && cmd !== 'ping' && cmd !== 'speedtest' && cmd !== 'hack') {
                window.NexoAudio.playClick();
            }
            const result = COMMANDS[cmd](args);
            if(result !== null && result !== undefined && result !== '') {
                appendLine(result, 'out');
            }
        } else {
            if (window.NexoAudio) window.NexoAudio.playLaser();
            appendLine(`Command not found: <span style="color:var(--neon-magenta)">${cmd}</span> — type <span style="color:var(--neon-cyan)">help</span>`, 'err');
        }
    }

    termInput.addEventListener('keydown', e => {
        if(e.key === 'Enter'){
            handleCommand(termInput.value);
            termInput.value = '';
        } else if(e.key === 'ArrowUp'){
            if(histIdx < cmdHistory.length - 1){ histIdx++; termInput.value = cmdHistory[histIdx]; }
            e.preventDefault();
        } else if(e.key === 'ArrowDown'){
            if(histIdx > 0){ histIdx--; termInput.value = cmdHistory[histIdx]; }
            else { histIdx = -1; termInput.value = ''; }
            e.preventDefault();
        } else if(e.key === 'Tab'){
            e.preventDefault();
            const val = termInput.value.trim().toLowerCase();
            const allCmds = Object.keys(COMMANDS);
            const m = allCmds.find(k => k.startsWith(val));
            if(m) termInput.value = m;
        } else if(e.key.length === 1 && window.NexoAudio) {
            window.NexoAudio.playType();
        }
    });

    // Boot sequence
    const boots=[
        {text:'  ███╗   ██╗███████╗██╗  ██╗ ██████╗ ',delay:0,c:'art'},
        {text:'  ████╗  ██║██╔════╝╚██╗██╔╝██╔═══██╗',delay:100,c:'art'},
        {text:'  ██╔██╗ ██║█████╗   ╚███╔╝ ██║   ██║',delay:200,c:'art'},
        {text:'  ██║╚██╗██║██╔══╝   ██╔██╗ ██║   ██║',delay:300,c:'art'},
        {text:'  ██║ ╚████║███████╗██╔╝ ██╗╚██████╔╝',delay:400,c:'art'},
        {text:'  ╚═╝  ╚═══╝╚══════╝╚═╝  ╚═╝ ╚═════╝ ',delay:500,c:'art'},
        {text:'',delay:600},
        {text:'   ASTERIX-OS v1.0 // SOVEREIGN CYBER OS [COMPANY PRIDE]',delay:700,c:'dim'},
        {text:'  ─────────────────────────────────────────────────────────────',delay:800,c:'dim'},
        {text:'',delay:900},
        {text:'[  OK  ] Initializing ASTERIX-OS microkernel & sovereign VFS...',delay:1000,c:'success'},
        {text:'[  OK  ] Loading Post-Quantum CryptFS & Asterix-Anti-Attack scrubbing...',delay:1200,c:'success'},
        {text:'[  OK  ] Cyber toolchains engaged (htop, nmap, ping, cve, decrypt)...',delay:1400,c:'success'},
        {text:'[  OK  ] Establishing Web Audio procedural synthesis & zero-telemetry daemon...',delay:1600,c:'success'},
        {text:'[  OK  ] Virtual shell initialized at /home/nexo. Flagship status: ONLINE.',delay:1800,c:'success'},
        {text:'',delay:2000},
        {text:'Welcome to <span style="color:var(--neon-gold)"> ASTERIX-OS v1.0</span> (NEXO-TECHNOLOGIES Company Pride).',delay:2200,c:'out'},
        {text:'Type <span style="color:var(--neon-gold)">asterixos</span> to inspect our sovereign OS, or <span style="color:var(--neon-cyan)">projects</span> for our full cyber arsenal.',delay:2400,c:'out'},
        {text:'',delay:2500},
    ];
    boots.forEach(l=>setTimeout(()=>appendLine(l.text||'',l.c||''),l.delay));
    setTimeout(()=>termInput.focus(),2600);
    termBody.addEventListener('click',()=>termInput.focus());
    updatePrompt();
    </script>
